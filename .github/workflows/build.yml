name: Build Iris's Counter
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    name: Windows Geode build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch and customize MIT licensed counter
        run: python scripts/prepare_source.py
      - name: Run upstream Python tests
        run: python tests/check_settings.py
      - name: Build mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: latest
          target: Win64
      - name: Upload Windows .geode
        uses: actions/upload-artifact@v4
        with:
          name: Iris-Counter-Windows
          path: ${{ steps.build.outputs.build-output }}
          if-no-files-found: error
